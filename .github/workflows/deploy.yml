name: Deploy to EC2 (Sequential)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - host: EC2_A
            key: EC2_SSH_KEY
          - host: EC2_B
            key: EC2_SSH_KEY
          # add more if needed
          # - host: 
          #   key: 

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.target.host] }}
          username: ubuntu
          key: ${{ secrets[matrix.target.key] }}
          script: |
            sudo mkdir -p /opt/UNIC2
            sudo chown ubuntu:ubuntu /opt/UNIC2
            cd /opt/UNIC2

            if [ ! -d .git ]; then
              git clone https://github.com/leoluKL/uniC2.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            # ===== prepare DeviceManagement Backend service =====
            cd /opt/UNIC2/DeviceManagement
            npm ci --omit=dev

            # write /etc/devicemanagement.env
            sudo bash -c "cat >/etc/devicemanagement.env" << 'EOF'
            KEYCLOAK_DEVICEMANAGEMENTCLIENTSECRET=${{ secrets.KEYCLOAK_DEVICEMANAGEMENTCLIENTSECRET }}
            KEYCLOAK_URL=https://unic2keycloak.stenmss.org
            KEYCLOAK_REALM=unic2
            KEYCLOAK_CLIENT_ID=unic2-devicemanagement-backend
            NODE_ENV=production
            ALLOWED_ORIGINS=http://localhost:5173,https://unic2.stenmss.org
            PORT=8081
            EOF
            sudo chown root:root /etc/devicemanagement.env
            sudo chmod 600 /etc/devicemanagement.env

            # write devicemanagement.service
            sudo bash -c "cat >/etc/systemd/system/devicemanagement.service" << 'EOF'
            [Unit]
            Description=Unic2 DeviceManagement Backend
            After=network.target

            [Service]
            Type=simple
            User=ubuntu
            WorkingDirectory=/opt/UNIC2/DeviceManagement
            EnvironmentFile=/etc/devicemanagement.env
            ExecStart=/usr/bin/node index.js
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF
            # =====end of prepare DeviceManagement Backend service =====

            # ===== WS Backend =====
            cd /opt/UNIC2/unic2_ws_backend
            npm ci --omit=dev

            # write /etc/wsbackend.env
            sudo bash -c "cat >/etc/wsbackend.env" << 'EOF'
            KEYCLOAK_URL=https://unic2keycloak.stenmss.org
            KEYCLOAK_REALM=unic2
            PORT=8082
            EOF
            sudo chown root:root /etc/wsbackend.env
            sudo chmod 600 /etc/wsbackend.env

            # write wsbackend.service
            sudo bash -c "cat >/etc/systemd/system/wsbackend.service" << 'EOF'
            [Unit]
            Description=Unic2 WS Backend
            After=network.target

            [Service]
            Type=simple
            User=ubuntu
            WorkingDirectory=/opt/UNIC2/unic2_ws_backend
            EnvironmentFile=/etc/wsbackend.env
            ExecStart=/usr/bin/node server.js
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF
            # =====end of prepare DeviceManagement Backend service =====


            sudo systemctl daemon-reload

            # to view log in the ec2 instance, example command is : journalctl -u wsbackend -f
            sudo systemctl enable devicemanagement.service
            sudo systemctl restart devicemanagement.service
            sudo systemctl enable wsbackend.service
            sudo systemctl restart wsbackend.service