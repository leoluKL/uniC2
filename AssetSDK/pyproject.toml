[project]
name = "unic2-asset-sdk"
version = "0.0.4"
description = "Asset SDK for UniC2 platform"
authors = [{name="Yihui"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31,<3",
    "websocket-client>=1.6,<2"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]